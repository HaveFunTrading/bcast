[package]
name = "bcast"
version = "1.0.0-rc.6"
edition = "2024"
license = "MIT"
description = "Low latency broadcast (SPMC) buffer designed to work with shared memory."
readme = "./README.md"
documentation = "https://docs.rs/bcast"
repository = "https://github.com/HaveFunTrading/bcast"
keywords = ["ipc", "spmc", "shared-memory", "low-latency", "ring-buffer"]
categories = ["data-structures", "concurrency", "asynchronous"]
rust-version = "1.90.0"

[features]
default = []
mmap = ["dep:memmap2"]

[dependencies]
crossbeam-utils = "0.8.20"
memmap2 = { version = "0.9.5", optional = true }

[dev-dependencies]
anyhow = "1.0.93"
rand = "0.8.5"
memmap2 = "0.9.5"
hdrhistogram = "7.5.4"
libc = "0.2.172"
tempfile = "3.20.0"

[profile.release]
codegen-units = 1
lto = true
debug = true

[profile.bench]
codegen-units = 1
lto = true
debug = false

[[bench]]
name = "rtt"
harness = false
path = "benches/rtt.rs"

[[bench]]
name = "rx"
harness = false
path = "benches/rx.rs"
required-features = ["mmap"]

[[bench]]
name = "throughput"
harness = false
path = "benches/throughput.rs"
required-features = ["mmap"]

[[bench]]
name = "mmap_fanout"
harness = false
path = "benches/mmap_fanout.rs"
required-features = ["mmap"]

[[example]]
name = "reader_ipc"
required-features = ["mmap"]

[[example]]
name = "writer_ipc"
required-features = ["mmap"]
